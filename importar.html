<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importador de Zonas (com Dilemas)</title>
    <style>
        body {
            background: #0a0a0a;
            color: #ccc;
            font-family: 'Courier New', monospace;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .ok { color: #4caf50; }
        .erro { color: #e53935; }
        .aviso { color: #d9a441; }
        textarea {
            width: 100%;
            height: 300px;
            background: #111;
            color: #ccc;
            border: 1px solid #333;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            background: #d9a441;
            color: #000;
            border: none;
            padding: 12px 24px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            margin-top: 10px;
            font-family: inherit;
        }
        .btn:hover { background: #e0b050; }
        .file-input-wrapper {
            margin: 20px 0;
            padding: 20px;
            border: 2px dashed #444;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
        }
        .file-input-wrapper.dragover {
            border-color: #d9a441;
            background: #1a150a;
        }
        pre {
            background: #0a0a0a;
            padding: 10px;
            border: 1px solid #222;
            overflow: auto;
            max-height: 200px;
            font-size: 11px;
            border-radius: 4px;
        }
        #status {
            margin: 10px 0;
            padding: 10px;
            background: #0a0a0a;
            border: 1px solid #222;
            max-height: 200px;
            overflow: auto;
            font-size: 12px;
            border-radius: 4px;
        }
        #status .ok { color: #4caf50; }
        #status .erro { color: #e53935; }
        #status .aviso { color: #d9a441; }
        #status .info { color: #888; }
    </style>
</head>
<body>
    <h1>🧩 Importador de Zonas (com Dilemas)</h1>
    <p>Cole o JSON corrigido do validador ou arraste um arquivo para importar diretamente no Firestore.<br>
    <strong>As cenas (texto_evento + dilemas) serão injetadas automaticamente nas salas.</strong></p>

    <div class="file-input-wrapper" id="drop">
        📂 Arraste o arquivo JSON aqui ou clique para selecionar
        <input type="file" id="fileInput" accept=".json" style="display:none;">
    </div>

    <p>ou</p>

    <textarea id="jsonInput" placeholder='Cole aqui o JSON corrigido do validador...'></textarea>
    <button class="btn" onclick="importarJSON()">🚀 Importar para o Firestore</button>

    <div id="status"></div>
    <div id="resultado"></div>

    <!-- Firebase compat (versão que suporta firebase.auth()) -->
    <script src="https://www.gstatic.com/firebasejs/11.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.4.0/firebase-auth-compat.js"></script>

    <script>
        // ============================================================
        // CONFIGURAÇÃO DO FIREBASE (MESMA DO SEU JOGO)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyC0XfvjonW2gd1eGAZX7NBYfPGMwI2siJw",
            authDomain: "centelhagame-9d511.firebaseapp.com",
            projectId: "centelhagame-9d511",
            storageBucket: "centelhagame-9d511.appspot.com",
            messagingSenderId: "700809803145",
            appId: "1:700809803145:web:bff4c6a751ec9389919d58"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============================================================
        // LIMPEZA DE VÍCIOS DE IA (idêntica à de vamosla.html)
        // Precisa existir aqui também porque o importador é um arquivo
        // separado do jogo e não tem acesso às funções dele.
        // ============================================================
        function expurgarViciosIA(texto) {
            if (!texto) return texto;
            let limpo = texto.replace(/(?:,\s*|\s+)\b(?:quase\s+)?como se\b[^.!?]*([.!?]|$)/gi, '$1');
            limpo = limpo.replace(/(?:,\s*|\s+)\b(?:quase\s+)?como (?:um|uma)\b[^.!?]*([.!?]|$)/gi, '$1');
            limpo = limpo.replace(/\b[Dd]e repente,?\s*/g, '');
            return limpo.replace(/\s{2,}/g, ' ').trim();
        }

        // ============================================================
        // FUNÇÃO DE IMPORTAÇÃO (COM INJEÇÃO DE TEXTO_EVENTO + DILEMAS)
        //
        // Replica fielmente aplicarArquitetoDeCenas() de vamosla.html,
        // para que uma zona importada manualmente fique idêntica a uma
        // gerada organicamente pelo Arquiteto de Cenas. Antes, esta
        // função só injetava os dilemas e ignorava cena.texto_evento —
        // por isso a descrição do evento (ex: "O Zelador Cego") nunca
        // aparecia no jogo, mesmo com cena_titulo e a opção de dilema
        // salvos corretamente no Firestore.
        // ============================================================
        async function importarParaFirestore(dados, uid) {
            const plano = dados.plano || {};
            const salas = dados.salas || {};
            const cenas = dados.cenas || [];

            // 1. Construir mapaMundo básico com as saídas do plano
            const mapaMundo = {};
            for (const [id, sala] of Object.entries(salas)) {
                const planoItem = plano[id];
                if (!planoItem) continue;

                const opcoes = (planoItem.saidas || []).map(s => ({
                    texto: s.acao || s.texto || 'Avançar',
                    destino: s.destino
                }));

                mapaMundo[id] = {
                    nome: planoItem.local_fisico || `Sala ${id}`,
                    texto_logico: sala.texto_logico || '',
                    opcoes: opcoes
                };
            }

            // 2. Injetar as cenas (texto_evento + dilemas) nas salas correspondentes
            for (const cena of cenas) {
                const salaId = String(cena.sala_id);
                const sala = mapaMundo[salaId];
                if (!sala) {
                    log(`⚠️ Cena para sala ${salaId} ignorada: sala não existe.`, 'aviso');
                    continue;
                }

                const titulo = (cena.titulo || 'Evento Inesperado').trim();
                const textoEvento = expurgarViciosIA((cena.texto_evento || '').trim());

                if (!textoEvento) {
                    // Mesmo comportamento do jogo: sem texto_evento, a cena
                    // inteira (inclusive dilemas) é ignorada para esta sala.
                    log(`⚠️ Cena "${titulo}" (sala ${salaId}) não tem "texto_evento" no JSON — nada foi injetado nesta sala.`, 'aviso');
                    continue;
                }

                // Funde o texto_evento no texto_logico, na mesma ordem/formatação do jogo
                let textoBase = expurgarViciosIA((sala.texto_logico || '').trim());
                sala.texto_logico = `${textoBase.replace(/[.\s]+$/, '')}. ${textoEvento}`;
                sala.cena_titulo = titulo;
                sala.cena_aplicada = true;

                if (!sala.opcoes) sala.opcoes = [];

                // Destinos "reais" já existentes na sala (saídas do plano),
                // usados para validar para onde um dilema pode levar
                const destinosValidos = new Set(
                    (sala.opcoes || [])
                        .filter(o => o.destino && !o.arquiteto)
                        .map(o => String(o.destino))
                );

                const dilemas = Array.isArray(cena.dilemas) ? cena.dilemas : [];

                for (const dilema of dilemas) {
                    const opcaoTexto = (dilema.opcao_texto || 'Observar com cautela').trim();
                    const narrativaBruta = expurgarViciosIA((dilema.resultado_texto || '').trim());
                    if (!narrativaBruta) continue;

                    const dano = typeof dilema.dano === 'number'
                        ? Math.min(20, Math.max(0, Math.round(dilema.dano)))
                        : 0;

                    const resultadoTexto = dano > 0
                        ? `${narrativaBruta.replace(/[.\s]+$/, '')}. Você perde ${dano} de energia.`
                        : narrativaBruta;

                    const destinoRaw = dilema.destino_id ? String(dilema.destino_id) : null;
                    const destinoValidado = (destinoRaw && destinosValidos.has(destinoRaw))
                        ? parseInt(destinoRaw)
                        : null;

                    // Valida e prepara ramificações, igual ao jogo
                    const ramsRaw = Array.isArray(dilema.ramificacoes) ? dilema.ramificacoes : [];
                    const ramificacoes = ramsRaw
                        .filter(r => r.opcao_texto && r.resultado_texto)
                        .map(r => {
                            const rDano = typeof r.dano === 'number'
                                ? Math.min(20, Math.max(0, Math.round(r.dano)))
                                : 0;
                            const rDestinoRaw = r.destino_id ? String(r.destino_id) : null;
                            const rDestino = (rDestinoRaw && destinosValidos.has(rDestinoRaw))
                                ? parseInt(rDestinoRaw)
                                : null;
                            const rNarrativaLimpa = expurgarViciosIA((r.resultado_texto || '').trim());

                            return {
                                opcao_texto: r.opcao_texto.trim(),
                                resultado_texto: rDano > 0
                                    ? `${rNarrativaLimpa.replace(/[.\s]+$/, '')}. Você perde ${rDano} de energia.`
                                    : rNarrativaLimpa,
                                dano: rDano,
                                destino: rDestino
                            };
                        });

                    sala.opcoes.push({
                        texto: opcaoTexto,
                        arquiteto: true,        // sinaliza que veio do arquiteto
                        dilema: true,
                        resultado_texto: resultadoTexto,
                        dano,
                        destino: destinoValidado,
                        disparado: false,
                        ramificacoes: ramificacoes.length > 0 ? ramificacoes : null
                    });
                }

                log(`🎭 "${titulo}" → Sala ${salaId} | texto_evento injetado, ${dilemas.length} dilema(s) processado(s)`, 'ok');
            }

            // 3. Salvar no Firestore
            const docRef = db.collection('players').doc(uid);
            await docRef.update({
                mapaMundo: mapaMundo,
                zonaAtual: 1,
                secaoAtualId: '1'
            });

            return { mapaMundo, zonaAtual: 1 };
        }

        // ============================================================
        // UI
        // ============================================================
        const statusDiv = document.getElementById('status');
        const resultadoDiv = document.getElementById('resultado');

        function log(msg, tipo = 'info') {
            const div = document.createElement('div');
            div.className = tipo;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            statusDiv.appendChild(div);
            statusDiv.scrollTop = statusDiv.scrollHeight;
        }

        window.importarJSON = async function() {
            const jsonStr = document.getElementById('jsonInput').value.trim();
            if (!jsonStr) {
                alert('Cole o JSON corrigido ou arraste um arquivo.');
                return;
            }

            try {
                const dados = JSON.parse(jsonStr);
                log('📂 JSON carregado com sucesso.', 'ok');

                // Verifica se o JSON contém cenas e avisa
                if (dados.cenas && dados.cenas.length > 0) {
                    log(`🎭 ${dados.cenas.length} cenas encontradas. Serão injetadas como dilemas.`, 'info');
                }

                // Pega o UID do usuário (versão compat)
                const auth = firebase.auth();
                const user = auth.currentUser;

                if (!user) {
                    log('❌ Nenhum usuário logado. Faça login no jogo primeiro.', 'erro');
                    return;
                }

                log(`👤 Usuário: ${user.uid}`, 'info');
                log('⏳ Importando para o Firestore...', 'info');

                const resultado = await importarParaFirestore(dados, user.uid);

                log('✅ Zona importada com sucesso!', 'ok');
                log(`📊 ${Object.keys(resultado.mapaMundo).length} salas injetadas.`, 'ok');

                resultadoDiv.innerHTML = `
                    <p class="ok">✅ Importação concluída!</p>
                    <pre>${JSON.stringify(resultado, null, 2)}</pre>
                    <button class="btn" onclick="window.location.href='./vamosla.html'">🎮 Voltar ao Jogo</button>
                `;

            } catch (e) {
                log(`❌ Erro: ${e.message}`, 'erro');
                console.error(e);
            }
        };

        // ============================================================
        // DRAG AND DROP
        // ============================================================
        const drop = document.getElementById('drop');
        const fileInput = document.getElementById('fileInput');

        drop.addEventListener('dragover', (e) => {
            e.preventDefault();
            drop.classList.add('dragover');
        });

        drop.addEventListener('dragleave', () => {
            drop.classList.remove('dragover');
        });

        drop.addEventListener('drop', (e) => {
            e.preventDefault();
            drop.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) lerArquivo(file);
        });

        drop.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            if (fileInput.files[0]) lerArquivo(fileInput.files[0]);
        });

        function lerArquivo(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('jsonInput').value = e.target.result;
                log('📂 Arquivo carregado. Clique em "Importar" para enviar.', 'info');
            };
            reader.readAsText(file);
        }

        // ============================================================
        // VERIFICA AUTENTICAÇÃO INICIAL
        // ============================================================
        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                log(`✅ Usuário autenticado: ${user.displayName || user.email || user.uid}`, 'ok');
            } else {
                log('⚠️ Nenhum usuário logado. Abra o jogo primeiro e faça login.', 'aviso');
            }
        });

        log('🔧 Importador pronto. Cole o JSON ou arraste um arquivo.', 'info');
        log('📌 O texto_evento de cada cena será fundido ao texto_logico da sala, e os dilemas serão injetados como opções.', 'info');
    </script>
</body>
</html>
